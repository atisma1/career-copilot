<title>Career Copilot</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12365F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Career Copilot">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface2:#E9EFF6; --ink:#0D1E34; --ink2:#465A72; --ink3:#71839A;
  --line:#D3DDE8; --brand:#12365F; --brand-ink:#FFFFFF; --accent:#1B66C2; --accent-soft:#DFEBFA;
  --warn:#A55F00; --warn-soft:#FFEFCF; --good:#17704A; --good-soft:#DCF2E5; --bad:#AE2C22; --bad-soft:#FAE1DE;
  --t-job:#DFEBFA; --t-trainee:#D9F0EE; --t-nysc:#E1F2E5; --t-training:#E6E4F6;
  --shadow:0 1px 2px rgba(13,30,52,.06),0 8px 24px rgba(13,30,52,.08);
  --f-ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-display:'Newsreader',Georgia,'Times New Roman',serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#08121F; --surface:#0F1D2E; --surface2:#162942; --ink:#E7EEF7; --ink2:#A3B5CA; --ink3:#7C90A8;
    --line:#22364E; --brand:#7DB3F4; --brand-ink:#07172A; --accent:#7DB3F4; --accent-soft:#16304F;
    --warn:#F0B14F; --warn-soft:#3A2A0D; --good:#5DCB94; --good-soft:#0F3324; --bad:#FF8E84; --bad-soft:#40130F;
    --t-job:#16304F; --t-trainee:#0F3433; --t-nysc:#123421; --t-training:#26244A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#08121F; --surface:#0F1D2E; --surface2:#162942; --ink:#E7EEF7; --ink2:#A3B5CA; --ink3:#7C90A8;
  --line:#22364E; --brand:#7DB3F4; --brand-ink:#07172A; --accent:#7DB3F4; --accent-soft:#16304F;
  --warn:#F0B14F; --warn-soft:#3A2A0D; --good:#5DCB94; --good-soft:#0F3324; --bad:#FF8E84; --bad-soft:#40130F;
  --t-job:#16304F; --t-trainee:#0F3433; --t-nysc:#123421; --t-training:#26244A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (min-width:820px){body{padding-bottom:40px}}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.15;text-wrap:balance}
h1{font-family:var(--f-display);font-size:clamp(28px,5vw,44px);letter-spacing:-.01em;font-weight:500}
h2{font-family:var(--f-display);font-size:clamp(21px,3vw,27px);letter-spacing:-.005em;font-weight:500}
h3{font-size:15px}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.muted{color:var(--ink2)} .faint{color:var(--ink3)}
.mono{font-family:var(--f-mono)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar + nav */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.01em;background:none;border:0;padding:0;color:var(--ink)}
.brand svg{width:26px;height:26px;color:var(--brand)}
.tabs{display:none;gap:2px;margin-left:8px;flex:1}
.tabs button{white-space:nowrap;background:none;border:0;padding:8px 12px;border-radius:6px;color:var(--ink2);font-weight:500}
.tabs button:hover{background:var(--surface2);color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--surface2);box-shadow:inset 0 -2px 0 var(--brand)}
.top .spacer{flex:1}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.bottom button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink3);padding:4px 0;min-width:0}
.bottom button svg{width:22px;height:22px}
.bottom button[aria-current="page"]{color:var(--brand)}
@media (min-width:820px){.tabs{display:flex}.bottom{display:none}}

/* buttons, chips */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:7px;font-weight:500;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 8px;font-size:12px;font-weight:500;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip svg{width:13px;height:13px}
.badge{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;color:var(--ink)}
.badge.job{background:var(--t-job)} .badge.trainee{background:var(--t-trainee)} .badge.nysc{background:var(--t-nysc)} .badge.training{background:var(--t-training)}
.filterchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;color:var(--ink2)}
.filterchip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink2)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 11px;min-height:40px}
textarea{resize:vertical;min-height:80px;line-height:1.45}
input:hover,select:hover,textarea:hover{border-color:var(--ink3)}
.hint{font-size:12.5px;color:var(--ink3)}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}
.grid3{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}

/* page scaffolding */
main{padding-block:26px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.pagehead p{max-width:62ch;margin-top:6px}
.section{margin-top:34px}
.section>.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.hair{border:0;border-top:1px solid var(--line);margin:18px 0}
.two{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.two>*{min-width:0}
@media (min-width:980px){.two{grid-template-columns:minmax(0,1fr) 320px;align-items:start}.two.wide{grid-template-columns:minmax(0,1fr) 420px}.sticky{position:sticky;top:76px}}

/* hero / welcome */
.hero{padding:6px 0 4px}
.hero p.lead{font-size:17px;color:var(--ink2);max-width:60ch;margin-top:12px}
.paths{display:grid;gap:12px;grid-template-columns:1fr;margin-top:24px}
@media (min-width:760px){.paths{grid-template-columns:repeat(3,1fr)}}
.path{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.path:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.path strong{font-family:var(--f-display);font-size:20px;font-weight:500}
.path span{color:var(--ink2);font-size:14px}
.path .go{margin-top:auto;padding-top:6px;color:var(--accent);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:5px}

/* stat strip */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat:nth-child(2n){border-right:0}
@media (min-width:760px){.stat{border-bottom:0}.stat:nth-child(2n){border-right:1px solid var(--line)}.stat:last-child{border-right:0}}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--ink2)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn)}

/* checklist */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:1px;display:grid;place-items:center;color:var(--brand-ink)}
.dot svg{width:12px;height:12px;display:none}
.done .dot{background:var(--good);border-color:var(--good)}
.done .dot svg{display:block}
.done .st{color:var(--ink3);text-decoration:line-through}

/* listings */
.filters{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.filters .row1{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.filters .row1 .searchbox{grid-column:1/-1}
@media (min-width:760px){.filters .row1{grid-template-columns:2fr 1fr 1fr 1fr 1fr}.filters .row1 .searchbox{grid-column:auto}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.searchbox{position:relative}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--ink3);pointer-events:none}
.searchbox input{padding-left:34px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:13.5px}
.notice svg{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent)}
.notice.warn{background:var(--warn-soft)} .notice.warn svg{color:var(--warn)}
.list{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:980px){.list.cols{grid-template-columns:1fr 1fr}}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;text-align:left;width:100%;position:relative}
.item:hover{border-color:var(--ink3)}
.item.closed{opacity:.6}
.item .top1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item h3{font-size:16.5px;font-weight:600;line-height:1.25}
.item .org{color:var(--ink2);font-size:13.5px}
.item .meta{display:flex;flex-wrap:wrap;gap:6px}
.item .foot{display:flex;align-items:center;gap:10px;margin-top:2px}
.item .foot .fit{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.item .foot .fit .bar{flex:1;max-width:140px}
.item .foot .fit span{font-size:12px;color:var(--ink2);font-family:var(--f-mono);white-space:nowrap}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.iconbtn:hover{color:var(--ink);border-color:var(--ink3)}
.iconbtn svg{width:17px;height:17px}
.iconbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.opencard{position:absolute;inset:0;background:none;border:0;border-radius:10px}
.item .top1,.item h3,.item .org,.item .meta,.item .foot{position:relative;pointer-events:none}
.item .foot .iconbtn,.item .foot .btn{pointer-events:auto}

/* drawer */
.backdrop{position:fixed;inset:0;background:rgba(6,14,26,.55);z-index:40}
.drawer{position:fixed;z-index:41;background:var(--surface);color:var(--ink);display:flex;flex-direction:column;box-shadow:var(--shadow);inset:0}
@media (min-width:820px){.drawer{inset:0 0 0 auto;width:min(560px,100%);border-left:1px solid var(--line)}}
.drawer .dh{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line);padding-top:calc(16px + env(safe-area-inset-top,0px))}
.drawer .db{overflow:auto;padding:18px;flex:1;display:flex;flex-direction:column;gap:20px}
.drawer .df{display:flex;flex-wrap:wrap;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.kv{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:520px){.kv{grid-template-columns:1fr 1fr}}
.kv div b{display:block;font-size:12px;color:var(--ink3);font-weight:500;font-family:var(--f-mono);letter-spacing:.04em;text-transform:uppercase}
ul.tidy{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px;padding:6px 0}
.chk .ic{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;margin-top:1px}
.chk .ic svg{width:11px;height:11px}
.chk.ok .ic{background:var(--good-soft);color:var(--good)} .chk.no .ic{background:var(--bad-soft);color:var(--bad)} .chk.unk .ic{background:var(--surface2);color:var(--ink3)}
.chk small{display:block;color:var(--ink3);font-size:12.5px}

/* skills */
.skillgrid{display:flex;flex-wrap:wrap;gap:8px}
.skill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 10px;font-size:13.5px;font-weight:500;color:var(--ink2)}
.skill:hover{border-color:var(--ink3)}
.skill .lv{display:inline-flex;gap:2px}
.skill .lv i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.skill[data-l="1"]{border-color:var(--accent);color:var(--ink)} .skill[data-l="1"] .lv i:nth-child(-n+1){background:var(--accent)}
.skill[data-l="2"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)} .skill[data-l="2"] .lv i:nth-child(-n+2){background:var(--accent)}
.skill[data-l="3"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)} .skill[data-l="3"] .lv i{background:var(--brand-ink)}
.catlabel{margin:14px 0 8px}
.gapitem{display:grid;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.gapitem:last-child{border-bottom:0}
.gapitem .g1{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.gapitem .g1 .l{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.res{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.big{font-family:var(--f-display);font-size:64px;line-height:1;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ai{font-size:14.5px;line-height:1.6}
.ai h4{font-size:14px;margin:14px 0 4px}
.ai p{margin:0 0 8px}
.ai ol,.ai ul{margin:0 0 8px;padding-left:20px}

/* tracker */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.col{background:var(--surface2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px;scroll-snap-align:start}
.col>h3{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);padding:2px 4px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px;display:flex;flex-direction:column;gap:8px}
.tk h4{font-size:14px;line-height:1.25}
.tk .small{font-size:12.5px;color:var(--ink2)}
.tk select,.tk input,.tk textarea{min-height:34px;padding:6px 8px;font-size:13px}
.tk textarea{min-height:54px}
.plan{display:flex;flex-direction:column;gap:12px}
.pi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.pi.donei h3{text-decoration:line-through;color:var(--ink3)}

/* CV */
.paperwrap{overflow-x:auto;background:var(--surface2);border-radius:10px;padding:14px}
.paper{background:#fff;color:#111;width:794px;max-width:none;min-height:1000px;padding:44px 48px;margin:0 auto;font-family:'Instrument Sans',Arial,sans-serif;font-size:11.5px;line-height:1.5;box-shadow:var(--shadow);transform-origin:top left}
.paper h1{font-family:'Newsreader',Georgia,serif;font-size:30px;font-weight:600;color:#0D1E34;margin:0;letter-spacing:-.01em}
.paper .hl{font-size:13px;color:#33465C;margin-top:3px}
.paper .contact{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:11px;color:#33465C}
.paper h2{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#12365F;border-bottom:1.5px solid #12365F;padding-bottom:3px;margin:18px 0 8px;font-weight:500}
.paper .job{margin-bottom:9px}
.paper .job .jh{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.paper .job .jh span:last-child{font-weight:400;color:#33465C;white-space:nowrap}
.paper .job .jo{color:#33465C}
.paper ul{margin:4px 0 0;padding-left:16px}
.paper .tags{display:flex;flex-wrap:wrap;gap:5px}
.paper .tags span{border:1px solid #C9D5E3;border-radius:3px;padding:1px 7px;font-size:10.5px}
.paper.side{display:grid;grid-template-columns:230px 1fr;gap:0;padding:0}
.paper.side .sb{background:#12365F;color:#fff;padding:40px 22px}
.paper.side .sb h2{color:#BFD6F2;border-color:#3A5F8E}
.paper.side .sb .contact{flex-direction:column;color:#DCE8F7}
.paper.side .sb .tags span{border-color:#3A5F8E;color:#fff}
.paper.side .mn{padding:40px 30px}
.paper.side .mn h1{margin-bottom:2px}
.cvtools{display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (min-width:820px){.toast{bottom:28px;left:28px;transform:none}}
.empty{border:1px dashed var(--line);border-radius:10px;padding:26px 18px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;gap:10px;align-items:center}

let S = defaultState();
let memoryOnly = false;
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const o = JSON.parse(raw); if (o && o.v === 1) mergeState(o); }
  } catch (e) { memoryOnly = true; }
}
function mergeState(o) {
  const d = defaultState();
  S = Object.assign(d, o);
  S.profile = Object.assign(blankProfile(), o.profile || {});
  S.ui = Object.assign(d.ui, o.ui || {});
  S.ui.f = Object.assign(d.ui.f, (o.ui && o.ui.f) || {});
  S.ui.gap = Object.assign(d.ui.gap, (o.ui && o.ui.gap) || {});
}
let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 250);
}
function flush() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { memoryOnly = true; }
}

/* ---- dates ---- */
function daysLeft(iso) {
  if (!iso) return null;
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  return Math.round((new Date(iso + 'T00:00:00') - t0) / 864e5);
}
const isClosed = l => { const d = daysLeft(l.deadline); return d !== null && d < 0; };
const fmtDate = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
const monthYear = iso => new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', {month:'short', year:'numeric'});

/* ---- skills ---- */
const skName = id => SK[id] ? SK[id][0] : (S.names[id] || id.replace(/^x:/, ''));
const lvl = id => +S.profile.skills[id] || 0;
const slug = s => 'x:' + String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
const skillCount = () => Object.values(S.profile.skills).filter(v => v > 0).length;
function coverage(sk) {
  if (!sk || !sk.length) return null;
  let t = 0, g = 0;
  for (const [id, w] of sk) { t += w; const l = lvl(id); g += w * (l >= 2 ? 1 : l === 1 ? .5 : 0); }
  return g / t;
}
const WEIGHT = {3:'Essential', 2:'Important', 1:'Helpful'};

/* ---- eligibility ---- */
const CLASS_TXT = {5:'a First Class or Distinction', 4:'Second Class Upper (2:1) or Upper Credit', 3:'Second Class Lower (2.2) or Lower Credit'};
function eligibility(l) {
  const e = l.e || {}, p = S.profile, out = [];
  const add = (st, t, n) => out.push({st, t, n});
  if (e.minClass) {
    const c = CLASS_RANK[p.classOfDegree] || 0;
    add(!c ? 'unk' : c >= e.minClass ? 'ok' : 'no', 'Degree class: ' + CLASS_TXT[e.minClass] + ' or better',
      !c ? 'Add your degree class in Profile' : 'Yours: ' + p.classOfDegree);
  }
  if (e.nysc) {
    const s = p.nysc;
    const t = e.nysc === 'completed' ? 'NYSC completed' : e.nysc === 'serving-ok' ? 'NYSC completed, or serving with a clear completion date' : 'NYSC completed by December 2026';
    let st = 'unk', n = 'Add your NYSC status in Profile';
    if (s) {
      if (s === 'completed' || s === 'exempted') { st = 'ok'; n = 'Yours: ' + (s === 'completed' ? 'completed' : 'exempted'); }
      else if (s === 'serving') { st = e.nysc === 'serving-ok' ? 'ok' : 'unk'; n = e.nysc === 'serving-ok' ? 'You are serving, which this programme allows' : 'You are serving. Confirm your passing-out date meets this requirement'; }
      else { st = 'no'; n = 'You have not started service yet'; }
    }
    add(st, t, n);
  }
  if (e.maxAge) {
    const a = parseInt(p.age, 10);
    add(!a ? 'unk' : a <= e.maxAge ? 'ok' : 'no', 'Age: ' + e.maxAge + ' or under', !a ? 'Add your age in Profile (optional)' : 'Yours: ' + a);
  }
  if (e.minYears) {
    const y = p.yearsExp === '' ? null : parseFloat(p.yearsExp);
    add(y === null || isNaN(y) ? 'unk' : y >= e.minYears ? 'ok' : 'no', 'Experience: at least ' + e.minYears + ' year' + (e.minYears > 1 ? 's' : ''),
      y === null || isNaN(y) ? 'Add your years of experience in Profile' : 'Yours: ' + y + ' year' + (y === 1 ? '' : 's'));
  }
  if (e.maxYears) {
    const y = p.yearsExp === '' ? null : parseFloat(p.yearsExp);
    add(y === null || isNaN(y) ? 'unk' : y <= e.maxYears ? 'ok' : 'no', 'Experience: no more than ' + e.maxYears + ' year' + (e.maxYears > 1 ? 's' : ''),
      y === null || isNaN(y) ? 'Add your years of experience in Profile' : 'Yours: ' + y + ' year' + (y === 1 ? '' : 's'));
  }
  return out;
}

/* ---- fit score ---- */
function fitScore(l) {
  const cov = coverage(l.s);
  const has = skillCount() > 0;
  const cv = cov === null ? .5 : has ? cov : .35;
  const lf = S.audience ? (l.levels.includes(S.audience) ? 1 : .25) : .6;
  const sf = S.profile.sectors.length ? (S.profile.sectors.includes(l.sector) ? 1 : .35) : .6;
  let sc = .5 * cv + .28 * lf + .22 * sf;
  if (eligibility(l).some(x => x.st === 'no')) sc *= .6;
  return Math.round(sc * 100);
}

/* ---- profile strength ---- */
function strength() {
  const p = S.profile;
  const bullets = p.exp.filter(x => x.role && (x.bullets || '').split('\n').filter(s => s.trim()).length >= 2).length;
  const need = S.audience === 'mid' ? 2 : 1;
  const items = [
    {pts:8, f:(p.name && p.headline) ? 1 : 0, t:'Name and a one-line headline', h:'The headline states the role you want.'},
    {pts:7, f:(p.email || p.phone) ? 1 : 0, t:'Email or phone number', h:'Recruiters need a way to reach you.'},
    {pts:5, f:p.location ? 1 : 0, t:'Location', h:'Many postings are location-specific.'},
    {pts:15, f:(p.degree && p.discipline && p.institution && p.classOfDegree) ? 1 : 0, t:'Education with degree class', h:'Class of degree is a hard filter on many programmes.'},
    {pts:5, f:p.nysc ? 1 : 0, t:'NYSC status', h:'Needed for the eligibility checks.'},
    {pts:10, f:(p.summary || '').trim().length >= 120 ? 1 : 0, t:'Summary of at least 120 characters', h:'Three sentences: who you are, proof, what you want.'},
    {pts:20, f:Math.min(skillCount() / 6, 1), t:'Six or more skills rated', h:'Skills drive your fit score and gap analysis.'},
    {pts:15, f:Math.min(bullets / need, 1), t:need === 2 ? 'Two roles with achievements' : 'One role or project with achievements', h:'At least two bullet lines each, with numbers where you can.'},
    {pts:5, f:p.sectors.length ? 1 : 0, t:'Target sectors chosen', h:'Used to rank listings for you.'},
    {pts:10, f:(p.certs || '').trim() ? 1 : 0, t:'Certifications or short courses', h:'Named credentials are searched for by recruiters.'}
  ];
  const score = Math.round(items.reduce((a, i) => a + i.pts * i.f, 0));
  return {score, items};
}

/* ---- small UI helpers ---- */
function chip(cls, txt, icon) { return `<span class="chip ${cls || ''}">${icon ? ic(icon) : ''}${esc(txt)}</span>`; }
function deadlineChip(l) {
  if (!l.deadline) return l.stale
    ? chip('warn', (l.posted ? 'Posted ' + monthYear(l.posted) + ', ' : '') + 'confirm still open', 'clock')
    : chip('', 'No deadline stated', 'clock');
  const d = daysLeft(l.deadline);
  if (d < 0) return chip('bad', 'Closed ' + fmtDate(l.deadline), 'clock');
  if (d === 0) return chip('warn', 'Closes today', 'clock');
  if (d <= 7) return chip('warn', 'Closes in ' + d + ' day' + (d > 1 ? 's' : ''), 'clock');
  return chip('', 'Closes ' + fmtDate(l.deadline), 'clock');
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800);
}
function md(t) {
  const lines = esc(t).split('\n'); let out = '', list = null;
  const close = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of lines) {
    let s = raw.trim();
    if (!s) { close(); continue; }
    s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    let m;
    if ((m = s.match(/^#{1,4}\s+(.*)/))) { close(); out += `<h4>${m[1]}</h4>`; }
    else if ((m = s.match(/^[-*]\s+(.*)/))) { if (list !== 'ul') { close(); out += '<ul>'; list = 'ul'; } out += `<li>${m[1]}</li>`; }
    else if ((m = s.match(/^\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out += '<ol>'; list = 'ol'; } out += `<li>${m[1]}</li>`; }
    else { close(); out += `<p>${s}</p>`; }
  }
  close(); return out;
}

    if (f.level && !l.levels.includes(f.level)) return false;
    if (f.region && l.region !== f.region) return false;
    if (f.q) {
      const hay = (l.title + ' ' + l.org + ' ' + l.loc + ' ' + l.sum + ' ' + l.s.map(x => skName(x[0])).join(' ')).toLowerCase();
      if (!f.q.toLowerCase().split(/\s+/).filter(Boolean).every(w => hay.includes(w))) return false;

  });

function cvText() {
  const p = S.profile, aud = S.audience || 'fresh', L_ = [];
  L_.push((p.name || 'Your Name').toUpperCase()); if (p.headline) L_.push(p.headline);
  L_.push([p.email, p.phone, p.location].filter(Boolean).join(' | ')); L_.push('');
  const sec = {
    summary: () => p.summary ? ['PROFILE', p.summary, ''] : [],
    edu: () => (p.degree || p.institution) ? ['EDUCATION', [p.degree, p.discipline].filter(Boolean).join(' in ') + (p.gradYear ? ' (' + p.gradYear + ')' : ''), [p.institution, p.classOfDegree].filter(Boolean).join(', '), ''] : [],
    nysc: () => nyscLine() ? ['NATIONAL SERVICE', nyscLine().replace('NYSC: ', 'NYSC '), ''] : [],
    exp: () => { const r = []; p.exp.filter(x => x.role || x.org).forEach(x => { r.push(`${x.role}${x.org ? ', ' + x.org : ''}${x.period ? ' (' + x.period + ')' : ''}`); (x.bullets || '').split('\n').filter(s => s.trim()).forEach(b => r.push('- ' + b.replace(/^[-•*]\s*/, ''))); r.push(''); }); return r.length ? ['EXPERIENCE', ...r] : []; },
    skills: () => cvSkills().length ? ['SKILLS', cvSkills().join(', '), ''] : [],

function cvChecks() {

Current summary: ${p.summary || '(none written yet: draft one from the facts above)'}`, {modelTier:'quick', cache:false});
    const txt = r.text.trim().replace(/^["']|["']$/g, '');
    out.innerHTML = `<div class="panel" style="margin-top:10px;background:var(--surface2)"><p>${esc(txt)}</p><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm primary" data-a="usesum">Use this summary</button><button class="btn sm" data-a="dismisssum">Dismiss</button></div></div>`;
    out.dataset.txt = txt;
  } catch (e) { out.innerHTML = `<p class="hint" style="margin-top:8px">${esc(errCopy(e && e.code))}</p>`; }
  finally { btn.disabled = false; }
}

/* ---- events ---- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id, v = el.dataset.v;
  switch (a) {
    case 'tab': setTab(v); break;
    case 'aud': setAudience(v); break;
    case 'sample': loadSample(v); break;
    case 'sampleask': loadSample(S.audience || 'fresh'); break;
    case 'clearsample': S.profile = blankProfile(); S.names = {}; S.sample = false; save(); render(); toast('Sample cleared. Add your own details.'); break;
    case 'changepath': S.audience = null; save(); render(); break;
    case 'open': openDrawer(id); break;
    case 'close': closeLayer(); break;
    case 'data': openData(); break;
    case 'install': {
      if (deferredInstall) { deferredInstall.prompt(); const c = await deferredInstall.userChoice.catch(() => null); if (c && c.outcome === 'accepted') { toast('Installing…'); } deferredInstall = null; el.hidden = true; }
      break;
    }
    case 'save': {
      const i = S.saved.indexOf(id); if (i >= 0) S.saved.splice(i, 1); else S.saved.push(id);
      save(); toast(i >= 0 ? 'Removed from saved' : 'Saved'); refreshDrawer();
      $$(`[data-a="save"][data-id="${id}"]`).forEach(b => { if (!b.closest('.drawer')) { b.setAttribute('aria-pressed', i < 0); } });
      if (S.ui.tab === 'home') render(); break;
    }
    case 'track': toast(addTrack(id) ? 'Added to your tracker' : 'Already in your tracker'); refreshDrawer(); break;
    case 'gap': S.ui.gap.mode = 'listing'; S.ui.gap.target = id; S.ui.gap.ran = true; setTab('gap'); break;
    case 'ftype': { const t = S.ui.f.types, i = t.indexOf(v); if (i >= 0) t.splice(i, 1); else t.push(v); el.setAttribute('aria-pressed', i < 0); save(); renderResults(); break; }
    case 'clearfilters': S.ui.f = Object.assign(S.ui.f, {q:'', types:[], sector:'', level:'', region:'', sort:S.ui.f.sort, closed:false}); save(); render(); break;
    case 'skill': {
      const n = (lvl(id) + 1) % 4; if (n) S.profile.skills[id] = n; else delete S.profile.skills[id];
      save(); renderSkills(); updateStrength(); const b = $(`#skills [data-id="${id}"]`); if (b) b.focus(); break;
    }
    case 'addskill': {
      const inp = $('#ownsk'), name = (inp.value || '').trim(); if (!name) return;
      const key = Object.keys(SK).find(k => SK[k][0].toLowerCase() === name.toLowerCase()) || slug(name);
      if (!SK[key]) { S.names[key] = name.slice(0, 60); if (!S.profile.customSkills.includes(key)) S.profile.customSkills.push(key); }
      S.profile.skills[key] = Math.max(lvl(key), 2); inp.value = ''; save(); renderSkills(); updateStrength(); toast(name + ' added at solid level'); break;
    }
    case 'sector': { const s = S.profile.sectors, i = s.indexOf(v); if (i >= 0) s.splice(i, 1); else s.push(v); el.setAttribute('aria-pressed', i < 0); save(); updateStrength(); break; }
    case 'addexp': S.profile.exp.push({role:'', org:'', period:'', bullets:''}); save(); $('#exp').innerHTML = expHTML(); updateStrength(); { const f = $(`#er${S.profile.exp.length - 1}`); if (f) f.focus(); } break;
    case 'delexp': S.profile.exp.splice(+el.dataset.i, 1); save(); $('#exp').innerHTML = expHTML(); updateStrength(); break;
    case 'tpl': S.ui.cv = v; save(); render(); break;
    case 'print': printCV(); break;
    case 'copycv': toast((await copyText(cvText())) ? 'CV text copied' : 'Could not copy. Select the text in the preview instead.'); break;
    case 'dlcv': saveFile((S.profile.name || 'My').replace(/[^\w]+/g, '-') + '-CV.html', cvDoc()); break;
    case 'polish': polishSummary(); break;
    case 'usesum': { const t = $('#polishout').dataset.txt; if (t) { S.profile.summary = t; save(); $('#polishout').innerHTML = '<p class="hint" style="margin-top:8px">Summary updated.</p>'; $('#cvfit').innerHTML = cvHTML(S.ui.cv); $('#cvchecks').innerHTML = cvChecks(); } break; }
    case 'dismisssum': $('#polishout').innerHTML = ''; break;
    case 'gapcustom': S.ui.gap.mode = 'custom'; save(); render(); break;
    case 'analyse': analyseCustom(); break;
    case 'have': {
      S.profile.skills[id] = Math.max(lvl(id), 2); save(); toast(skName(id) + ' rated solid');
      if (S.ui.tab === 'gap') refreshGap(); else if (S.ui.tab === 'track') render(); break;
    }
    case 'planadd': { const t = currentTarget(); if (!S.plan.some(p => p.skill === id)) S.plan.push({id:uid(), skill:id, forTitle:t ? t.title : '', status:'todo', due:'', note:''}); save(); toast('Added to your learning plan'); refreshGap(); break; }
    case 'aiplan': runAI(); break;
    case 'aistop': if (aiCtl) aiCtl.abort(); break;
    case 'tk': S.ui.tk = v; save(); render(); break;
    case 'applied': { const t = S.track.find(x => x.id === id); if (t) { t.stage = 'applied'; save(); render(); toast('Marked as applied'); } break; }
    case 'deltrack': S.track = S.track.filter(x => x.id !== id); save(); render(); break;
    case 'delplan': S.plan = S.plan.filter(x => x.id !== id); save(); render(); break;
    case 'pstatus': { const p = S.plan.find(x => x.id === id); if (p) { p.status = v; save(); render(); } break; }
    case 'addmanual': {
      const t = ($('#mt').value || '').trim(); if (!t) { toast('Add the role title'); return; }
      S.track.push({id:uid(), lid:null, title:t, org:($('#mo').value || '').trim(), stage:$('#ms').value, next:'', nextDate:'', note:'', added:Date.now()}); save(); render(); break;
    }
    case 'copybk': toast((await copyText(JSON.stringify(S))) ? 'Backup copied' : 'Could not copy. Select the text and copy it.'); break;
    case 'dlbk': saveFile('career-copilot-backup.json', JSON.stringify(S, null, 2)); break;
    case 'restore': {
      try { const o = JSON.parse($('#rs').value); if (!o || o.v !== 1) throw 0; mergeState(o); flush(); closeLayer(); render(); toast('Backup restored'); }
      catch (e) { toast('That is not a valid backup code'); }
      break;
    }
    case 'reset':
      if (!armed.reset) { armed.reset = true; el.textContent = 'Click again to erase everything'; setTimeout(() => { armed.reset = false; if (el.isConnected) el.textContent = 'Erase everything'; }, 5000); return; }
      armed.reset = false; S = defaultState(); flush(); closeLayer(); render(); toast('Everything erased'); break;
  }
});
function onField(ev) {
  const el = ev.target;
  if (el.dataset.b) {
    const path = el.dataset.b, val = el.type === 'checkbox' ? el.checked : el.value;
    if (path === 'audience') { S.audience = val || null; if (val) { S.ui.cv = AUD[val].cv; } }
    else setPath(path, val);
    save();
    if (path.startsWith('ui.f.')) renderResults();
    else if (path === 'ui.sq') renderSkills();
    else if (path.startsWith('profile.')) { updateStrength(); if (path === 'profile.summary') { const c = $('#sumcount'); if (c) c.textContent = val.length + ' characters. Aim for 120 to 400.'; } }
  } else if (el.dataset.be !== undefined) {
    const x = S.profile.exp[+el.dataset.i]; if (x) { x[el.dataset.be] = el.value; save(); updateStrength(); }
  } else if (el.dataset.bt) {
    const t = S.track.find(x => x.id === el.dataset.id); if (t) { t[el.dataset.bt] = el.value; save(); if (el.dataset.bt === 'stage' && ev.type === 'change') render(); }
  } else if (el.dataset.bp) {
    const p = S.plan.find(x => x.id === el.dataset.id); if (p) { p[el.dataset.bp] = el.value; save(); }
  }
}
function setPath(path, val) { const ks = path.split('.'); let o = S; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
document.addEventListener('input', onField);
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.dataset.aChange === 'gaptarget') {
    const v = el.value;
    if (v === '__custom') { S.ui.gap.mode = 'custom'; } else { S.ui.gap.mode = 'listing'; S.ui.gap.target = v; S.ui.gap.ran = true; }
    save(); render();
  } else if (el.dataset.bt === 'stage') onField(ev);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && (openId || dataOpen)) { closeLayer(); return; }
  if (ev.key === 'Enter' && ev.target.id === 'ownsk') { ev.preventDefault(); const b = $('[data-a="addskill"]'); if (b) b.click(); return; }
  if (ev.key === 'Tab' && (openId || dataOpen)) {
    const d = $('#layer .drawer'); if (!d) return;
    const f = $$('a[href],button:not([disabled]):not([hidden]),input,select,textarea,[tabindex]:not([tabindex="-1"])', d).filter(e => e.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
});
window.addEventListener('resize', () => { if (S.ui.tab === 'cv') fitCV(); });
window.addEventListener('pagehide', flush);

/* ---- install (PWA) ---- */
let deferredInstall = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault(); deferredInstall = ev;
  const b = $('#installbtn'); if (b && !isStandalone()) b.hidden = false;
});
window.addEventListener('appinstalled', () => { deferredInstall = null; const b = $('#installbtn'); if (b) b.hidden = true; toast('Installed'); });
if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }

/* ---- init ---- */
load();
render();
(async () => {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const [s, d] = await Promise.all([window.claude.use('sample').catch(() => null), window.claude.use('downloads').catch(() => null)]);
      SAMPLE = s || null; DL = d || null;
    }
  } catch (e) { /* run without capabilities */ }
  CAPS = true; applyCaps();
})();
})();
</script>
